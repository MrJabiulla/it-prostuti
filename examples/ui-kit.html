<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Architecture UI Showcase</title>

  <!-- Google Fonts: Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core Component Styles -->
  <link rel="stylesheet" href="../src/styles.css">

  <style>
    /* Demo Page Layout Styles */
    .app-layout {
      max-width: 1040px;
      margin: 0 auto;
      padding: 2rem 1.5rem 5rem;
    }

    .app-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--color-border);
    }

    .app-header__titles h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--color-text-primary);
    }

    .app-header__titles p {
      color: var(--color-text-secondary);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .app-header__controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .flex-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .code-tag {
      font-family: var(--font-family-mono);
      font-size: 0.8rem;
      padding: 0.2rem 0.4rem;
      border-radius: var(--radius-sm);
      background-color: var(--color-surface-variant);
      color: var(--color-secondary-dark);
      border: 1px solid var(--color-border);
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- Top Header with Theme & Language Controls -->
    <header class="app-header">
      <div class="app-header__titles">
        <h1 data-i18n="app.title">ক্লিন আর্কিটেকচার ইউআই কিট</h1>
        <p data-i18n="app.subtitle">মডুলার, সহজে পঠনযোগ্য এবং প্রোডাকশন-রেডি কম্পোনেন্ট সিস্টেম</p>
      </div>

      <div class="app-header__controls">
        <!-- Language Switcher Buttons -->
        <div id="language-switcher"></div>
        <!-- Theme Toggle Button -->
        <div id="theme-toggle"></div>
      </div>
    </header>

    <!-- Main Grid of Categories -->
    <main>
      <div class="grid-2">
        <!-- Category 1: Reusable Buttons -->
        <div id="card-buttons"></div>

        <!-- Category 2: Reusable Chips -->
        <div id="card-chips"></div>

        <!-- Category 3: Snack Messages (Toast) -->
        <div id="card-snacks"></div>

        <!-- Category 4: Dialogs & Modals -->
        <div id="card-dialogs"></div>
      </div>

      <!-- Category 5: Error Handling & Container Variants -->
      <div class="grid-2">
        <div id="card-errors"></div>
        <div id="card-containers"></div>
      </div>
    </main>
  </div>

  <!-- Application Script (ES Module) -->
  <script type="module">
    import {
      themeManager,
      i18n,
      errorHandler,
      Button,
      Chip,
      Container,
      Dialog,
      Snackbar,
      NetworkError,
      ValidationError,
      qs,
      createElement
    } from '../src/index.js';

    // 1. Initialize Error Catchers
    errorHandler.initGlobalCatchers();

    // 2. Setup Header Controls (Theme & Language)
    function setupHeader() {
      // Theme Button
      const themeBtn = new Button({
        label: themeManager.getEffectiveTheme() === 'dark' ? '☀️ Light' : '🌙 Dark',
        variant: 'outline',
        size: 'sm',
        onClick: (_, btn) => {
          const next = themeManager.toggleTheme();
          btn.setLabel(next === 'dark' ? '☀️ Light' : '🌙 Dark');
          Snackbar.info(`Theme changed to: ${next.toUpperCase()}`);
        }
      });
      qs('#theme-toggle').appendChild(themeBtn.getElement());

      // Language Switcher Chip/Button
      const langBnBtn = new Button({
        label: 'বাংলা',
        variant: i18n.getLanguage() === 'bn' ? 'primary' : 'outline',
        size: 'sm',
        onClick: () => switchLanguage('bn')
      });

      const langEnBtn = new Button({
        label: 'English',
        variant: i18n.getLanguage() === 'en' ? 'primary' : 'outline',
        size: 'sm',
        onClick: () => switchLanguage('en')
      });

      function switchLanguage(lang) {
        i18n.setLanguage(lang);
        langBnBtn.getElement().className = `app-btn app-btn--sm ${lang === 'bn' ? 'app-btn--primary' : 'app-btn--outline'}`;
        langEnBtn.getElement().className = `app-btn app-btn--sm ${lang === 'en' ? 'app-btn--primary' : 'app-btn--outline'}`;
        updateDynamicLabels();
        Snackbar.success(lang === 'bn' ? 'ভাষা বাংলায় পরিবর্তিত হয়েছে।' : 'Language changed to English.');
      }

      const langWrap = createElement('div', {
        className: 'flex-wrap',
        children: [langBnBtn.getElement(), langEnBtn.getElement()]
      });
      qs('#language-switcher').appendChild(langWrap);
    }

    // 3. Category: Reusable Buttons
    function renderButtonsSection() {
      const btnPrimary = new Button({
        label: 'Primary',
        variant: 'primary',
        onClick: () => Snackbar.info('Primary button clicked!')
      });

      const btnSecondary = new Button({
        label: 'Secondary',
        variant: 'secondary',
        onClick: () => Snackbar.info('Secondary button clicked!')
      });

      const btnOutline = new Button({
        label: 'Outline',
        variant: 'outline',
        onClick: () => Snackbar.info('Outline button clicked!')
      });

      const btnDanger = new Button({
        label: 'Danger',
        variant: 'danger',
        onClick: () => Snackbar.error('Danger button clicked!')
      });

      const btnLoading = new Button({
        label: 'Click for Loading',
        variant: 'primary',
        onClick: (_, btn) => {
          btn.setLoading(true);
          setTimeout(() => {
            btn.setLoading(false);
            Snackbar.success('Operation completed!');
          }, 2000);
        }
      });

      const btnGroup = createElement('div', {
        className: 'flex-wrap',
        children: [
          btnPrimary.getElement(),
          btnSecondary.getElement(),
          btnOutline.getElement(),
          btnDanger.getElement(),
          btnLoading.getElement()
        ]
      });

      const container = new Container({
        title: '1. Reusable Buttons (বাটন)',
        subtitle: 'Primary, Secondary, Outline, Danger, এবং Loading স্টেট',
        variant: 'surface',
        content: btnGroup
      });

      qs('#card-buttons').appendChild(container.getElement());
    }

    // 4. Category: Reusable Chips
    function renderChipsSection() {
      const chipPrimary = new Chip({ label: 'Technology', variant: 'primary', icon: '💻' });
      const chipSuccess = new Chip({ label: 'Active', variant: 'success', icon: '✓' });
      const chipWarning = new Chip({ label: 'Pending', variant: 'warning', icon: '⏳' });
      const chipError = new Chip({ label: 'Failed', variant: 'error', icon: '✕' });

      // Selectable / Filter Chip
      const filterChip = new Chip({
        label: 'Selectable Filter',
        selectable: true,
        selected: false,
        onClick: (selected) => {
          Snackbar.info(selected ? 'Filter activated' : 'Filter deactivated');
        }
      });

      // Removable Chip
      const removableChip = new Chip({
        label: 'Removable Tag',
        removable: true,
        onRemove: () => {
          Snackbar.warning('Chip tag removed!');
        }
      });

      const chipGroup = createElement('div', {
        className: 'flex-wrap',
        children: [
          chipPrimary.getElement(),
          chipSuccess.getElement(),
          chipWarning.getElement(),
          chipError.getElement(),
          filterChip.getElement(),
          removableChip.getElement()
        ]
      });

      const container = new Container({
        title: '2. Reusable Chips (ট্যাগ ও ফিল্টার)',
        subtitle: 'Status badge, Selectable/Filter, এবং Removable চিপ',
        variant: 'surface',
        content: chipGroup
      });

      qs('#card-chips').appendChild(container.getElement());
    }

    // 5. Category: Snack Messages (Toast)
    function renderSnackSection() {
      const btnSuccess = new Button({
        label: 'Success Snack',
        variant: 'outline',
        size: 'sm',
        onClick: () => Snackbar.success(i18n.t('snackbar.saved'))
      });

      const btnError = new Button({
        label: 'Error Snack',
        variant: 'outline',
        size: 'sm',
        onClick: () => Snackbar.error(i18n.t('snackbar.networkError'))
      });

      const btnWarning = new Button({
        label: 'Warning Snack',
        variant: 'outline',
        size: 'sm',
        onClick: () => Snackbar.warning(i18n.t('snackbar.warningNotice'))
      });

      const btnAction = new Button({
        label: 'With Action (Undo)',
        variant: 'secondary',
        size: 'sm',
        onClick: () => {
          Snackbar.show({
            message: i18n.t('snackbar.deleted'),
            type: 'default',
            action: {
              label: 'Undo',
              onClick: () => Snackbar.info('Undo action executed!')
            }
          });
        }
      });

      const group = createElement('div', {
        className: 'flex-wrap',
        children: [
          btnSuccess.getElement(),
          btnError.getElement(),
          btnWarning.getElement(),
          btnAction.getElement()
        ]
      });

      const container = new Container({
        title: '3. Snack Messages (স্ন্যাক মেসেজ)',
        subtitle: 'অটো ডিসমিস, কিউ সিস্টেম ও অ্যাকশন বাটন সাপোর্ট',
        variant: 'surface',
        content: group
      });

      qs('#card-snacks').appendChild(container.getElement());
    }

    // 6. Category: Dialogs & Modals
    function renderDialogsSection() {
      const btnAlert = new Button({
        label: 'Show Alert Dialog',
        variant: 'outline',
        size: 'sm',
        onClick: () => {
          Dialog.alert({
            title: i18n.t('dialog.alertTitle'),
            message: 'এটি একটি সাধারণ নোটিফিকেশন এলার্ট ডায়ালগ।'
          });
        }
      });

      const btnConfirm = new Button({
        label: 'Show Confirm Dialog',
        variant: 'primary',
        size: 'sm',
        onClick: async () => {
          const confirmed = await Dialog.confirm({
            title: i18n.t('dialog.confirmTitle'),
            message: i18n.t('dialog.confirmMessage'),
            variant: 'danger',
            confirmText: i18n.t('common.confirm')
          });

          if (confirmed) {
            Snackbar.success('Action Confirmed!');
          } else {
            Snackbar.info('Action Cancelled.');
          }
        }
      });

      const group = createElement('div', {
        className: 'flex-wrap',
        children: [btnAlert.getElement(), btnConfirm.getElement()]
      });

      const container = new Container({
        title: '4. Dialogs & Modals (ডায়ালগ)',
        subtitle: 'Backdrop blur, কীবোর্ড ESC সাপোর্ট এবং Promise-based Confirm',
        variant: 'surface',
        content: group
      });

      qs('#card-dialogs').appendChild(container.getElement());
    }

    // 7. Category: Error Handling
    function renderErrorsSection() {
      const btnNetworkError = new Button({
        label: 'Trigger NetworkError',
        variant: 'danger',
        size: 'sm',
        onClick: () => {
          try {
            throw new NetworkError();
          } catch (err) {
            errorHandler.handle(err);
          }
        }
      });

      const btnValidationError = new Button({
        label: 'Trigger ValidationError',
        variant: 'outline',
        size: 'sm',
        onClick: () => {
          try {
            throw new ValidationError('errors.validation', { email: 'Invalid email' });
          } catch (err) {
            errorHandler.handle(err);
          }
        }
      });

      const group = createElement('div', {
        className: 'flex-wrap',
        children: [btnNetworkError.getElement(), btnValidationError.getElement()]
      });

      const infoText = createElement('p', {
        style: { fontSize: '0.875rem', color: 'var(--color-text-secondary)', marginTop: '0.75rem' },
        text: 'সেন্ট্রালাইজড errorHandler ক্লাস ত্রুটি ক্যাপচার করে স্বয়ংক্রিয়ভাবে ব্যবহারকারীকে উপযুক্ত স্ন্যাক মেসেজ প্রদর্শন করে।'
      });

      const wrapper = createElement('div', {
        children: [group, infoText]
      });

      const container = new Container({
        title: '5. Error Handling (এরর হ্যান্ডলিং)',
        subtitle: 'Custom Error Classes ও গ্লোবাল ডিসপ্যাচার',
        variant: 'surface',
        content: wrapper
      });

      qs('#card-errors').appendChild(container.getElement());
    }

    // 8. Category: Container Variants
    function renderContainerVariantsSection() {
      const elevatedBox = new Container({
        title: 'Elevated Card',
        subtitle: 'Deep shadow effect',
        variant: 'elevated',
        padding: 'sm',
        content: createElement('span', { className: 'code-tag', text: 'variant: "elevated"' })
      });

      const outlinedBox = new Container({
        title: 'Outlined Card',
        subtitle: 'Bordered surface',
        variant: 'outlined',
        padding: 'sm',
        content: createElement('span', { className: 'code-tag', text: 'variant: "outlined"' })
      });

      const group = createElement('div', {
        style: { display: 'flex', flexDirection: 'column', gap: '1rem' },
        children: [elevatedBox.getElement(), outlinedBox.getElement()]
      });

      const container = new Container({
        title: '6. Container Variants (কনটেইনার)',
        subtitle: 'Surface, Elevated, Outlined ও Flat ভ্যারিয়েন্ট',
        variant: 'surface',
        content: group
      });

      qs('#card-containers').appendChild(container.getElement());
    }

    function updateDynamicLabels() {
      i18n.updateDom();
    }

    // Initialize application demo
    setupHeader();
    renderButtonsSection();
    renderChipsSection();
    renderSnackSection();
    renderDialogsSection();
    renderErrorsSection();
    renderContainerVariantsSection();
    i18n.updateDom();
  </script>
</body>
</html>
